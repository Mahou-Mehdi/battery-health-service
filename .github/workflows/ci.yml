name: Python checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m battery_health.cli demo --batteries 6 --cycles 75 --output /tmp/battery-model --report /tmp/battery-metrics.json
      - run: python -m battery_health.cli predict --model /tmp/battery-model/model.joblib
